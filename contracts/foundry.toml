[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Conservative EVM target so the same bytecode deploys on HSK Chain (OP-stack) testnet and mainnet.
evm_version = "paris"

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk = "https://mainnet.hsk.xyz"
