<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotHire on HSP</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e; --emp:#58a6ff; --wrk:#3fb950; --err:#f85149; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:20px 16px 8px; max-width:980px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  p.sub { margin:4px 0 0; color:var(--dim); }
  main { max-width:980px; margin:0 auto; padding:8px 16px 40px; display:grid; gap:12px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--dim); font-size:13px; }
  .step.on { color:var(--text); border-color:var(--wrk); }
  .step b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  ol#log { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  ol#log li { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--dim); border-radius:6px; padding:8px 10px; overflow-wrap:anywhere; }
  li.employer { border-left-color:var(--emp) !important; }
  li.worker { border-left-color:var(--wrk) !important; }
  li.error { border-left-color:var(--err) !important; }
  .meta { color:var(--dim); font-size:12px; }
  a { color:var(--emp); }
  .empty { color:var(--dim); padding:16px; text-align:center; border:1px dashed var(--line); border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>BotHire agent-to-agent hire, paid through HSP</h1>
  <p class="sub">Live log from both agents. Blue = employer agent, green = worker agent.</p>
</header>
<main>
  <div class="steps" id="steps"></div>
  <ol id="log"></ol>
  <div class="empty" id="empty">Waiting for the employer agent to start a hire…</div>
</main>
<script>
const STEPS = [
  ['discover','Discover'], ['quote','HSP order'], ['checked','Checks'], ['policy','Policy on HSK'],
  ['signed','Signed'], ['submitted','Submitted'], ['verified','Paid on-chain'], ['record','Recorded'], ['done','Delivered'],
];
const stepsEl = document.getElementById('steps');
const seen = new Set();
function drawSteps() {
  stepsEl.innerHTML = STEPS.map(([k, label], i) =>
    `<div class="step ${seen.has(k) ? 'on' : ''}"><b>${i + 1}</b>${label}</div>`).join('');
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const SAFE_URL = /^https:\/\/(testnet-explorer\.hskchain\.net|hsk\.blockscout\.com|sepolia\.basescan\.org)\/[\w\/.\-]+$/;
function add(e) {
  try {
    document.getElementById('empty').style.display = 'none';
    seen.add(String(e.kind)); drawSteps();
    const li = document.createElement('li');
    const agent = e.agent === 'employer' ? 'employer' : 'worker';
    li.className = `${agent} ${e.kind === 'error' ? 'error' : ''}`;
    const link = typeof e.url === 'string' && SAFE_URL.test(e.url) ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">tx</a>` : '';
    li.innerHTML = `<div class="meta">${esc(String(e.t || '').slice(11, 19))} · ${agent} · ${esc(e.kind)}${link}</div>${esc(e.text)}`;
    document.getElementById('log').appendChild(li);
  } catch {}
}
drawSteps();
fetch('/api/events').then((r) => r.json()).then((list) => list.forEach(add)).finally(() => {
  const es = new EventSource('/events');
  es.onmessage = (m) => { try { add(JSON.parse(m.data)); } catch {} };
});
</script>
</body>
</html>
